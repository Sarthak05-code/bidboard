# .github/workflows/commit-check.yml
name: Commit Message Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          COMMITS=$(git log origin/${{ github.base_ref }}..HEAD --pretty=format:"%s")
          
          INVALID=0
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            
            if ! echo "$msg" | grep -qiE "^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?!?\s*:\S*.+"; then
              echo "❌ Invalid: $msg"
              INVALID=$((INVALID + 1))
            fi
          done <<< "$COMMITS"
          
          if [ "$INVALID" -gt 0 ]; then
            echo ""
            echo "Commit messages must follow conventional commits:"
            echo "  feat: add new feature"
            echo "  fix: resolve bug"
            echo "  docs: update README"
            echo "  refactor: simplify logic"
            echo "  chore: update dependencies"
            echo ""
            exit 1
          fi
          
          echo "✅ All commits follow conventional format"
          
